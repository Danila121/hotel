{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сайт{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>

<header class="header">
    <h1><a href="{% url 'rooms:room_type' %}">Отель "Белый барашек"</a></h1>
</header>

<main class="main">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    © 2026
</footer>

<!-- CSRF токен для JavaScript -->
<script>
    // Получаем CSRF токен из cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    // Сохраняем токен в глобальную переменную
    window.csrftoken = getCookie('csrftoken');
    
    // Для отладки
    console.log('CSRF Token from base.html:', window.csrftoken ? 'Present' : 'Missing');
</script>

</body>
</html>
